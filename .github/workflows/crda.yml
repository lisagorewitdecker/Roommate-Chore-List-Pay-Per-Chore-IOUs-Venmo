name: Dependency vulnerability scan

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  crda-scan:
    name: Scan project vulnerabilities with npm audit (${{ matrix.directory }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        directory: [ ".", "server" ]
    defaults:
      run:
        working-directory: ${{ matrix.directory }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Audit locked dependencies
        run: npm audit --package-lock-only --ignore-scripts
